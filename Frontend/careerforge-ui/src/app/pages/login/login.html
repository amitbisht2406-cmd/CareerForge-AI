<div class="auth-shell">

  <div class="auth-card">

    <div class="brand">
      <span class="brand-mark">CF</span>
      <span class="brand-name">CareerForge AI</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Log in to keep building your career story.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <label>
        <span>Email</span>
        <input type="email" class="field" placeholder="you@example.com" formControlName="email">
      </label>
      <p class="error-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        Enter a valid email
      </p>

      <label>
        <span>Password</span>
        <input type="password" class="field" placeholder="••••••••" formControlName="password">
      </label>
      <p class="error-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Password is required
      </p>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn-primary btn-block" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Log in' }}
      </button>

    </form>

    <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>

  </div>

</div>
