<div
    class="form-card"
    [formGroup]="form"
>

    <div class="card-header">
        <h2>👤 Personal Information</h2>
        <p>Basic details about yourself.</p>
    </div>

    <div class="photo-upload-row">
        <div class="photo-preview" [class.has-photo]="photoBase64">
            <img *ngIf="photoBase64" [src]="photoBase64" alt="Profile photo">
            <span *ngIf="!photoBase64">No Photo</span>
        </div>
        <div class="photo-actions">
            <label class="upload-btn">
                Upload Photo
                <input type="file" accept="image/*" (change)="onPhotoSelected($event)" hidden>
            </label>
            <button type="button" class="remove-btn" *ngIf="photoBase64" (click)="removePhoto()">Remove</button>
        </div>
    </div>

    <input
        type="text"
        placeholder="Full Name"
        formControlName="fullName"
    >

    <p
        class="error"
        *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched"
    >
        Full Name is required
    </p>

    <input
        type="email"
        placeholder="Email"
        formControlName="email"
    >

    <p
        class="error"
        *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')"
    >
        Email is required
    </p>

    <p
        class="error"
        *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')"
    >
        Enter a valid email address
    </p>

    <input
        type="text"
        placeholder="Phone Number"
        formControlName="phone"
    >

    <p
        class="error"
        *ngIf="form.get('phone')?.touched && form.get('phone')?.hasError('required')"
    >
        Phone number is required
    </p>

    <p
        class="error"
        *ngIf="form.get('phone')?.touched && form.get('phone')?.hasError('pattern')"
    >
        Enter a valid 10-digit phone number
    </p>

    <input
        type="text"
        placeholder="GitHub Profile URL"
        formControlName="github"
    >

    <p
        class="error"
        *ngIf="form.get('github')?.touched && form.get('github')?.hasError('pattern')"
    >
        Enter a valid GitHub profile URL
    </p>

    <input
        type="text"
        placeholder="LinkedIn Profile URL"
        formControlName="linkedin"
    >

    <p
        class="error"
        *ngIf="form.get('linkedin')?.touched && form.get('linkedin')?.hasError('pattern')"
    >
        Enter a valid LinkedIn profile URL
    </p>

</div>
