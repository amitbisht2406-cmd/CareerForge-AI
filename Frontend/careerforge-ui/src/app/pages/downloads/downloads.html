<div class="downloads">

  <h1>Downloads</h1>
  <p class="subtitle">Everything you've built, in one place.</p>

  <div class="section">
    <h2>Resumes</h2>

    <p class="hint" *ngIf="isLoading">Loading...</p>

    <div class="empty card" *ngIf="!isLoading && resumes.length === 0">
      <p>No resumes yet.</p>
      <a routerLink="/resume-builder" class="btn-primary btn-narrow">Create one</a>
    </div>

    <div class="item card" *ngFor="let resume of resumes">
      <span>{{ resume.fullName || 'Untitled Resume' }}</span>
      <a routerLink="/resume-builder">Open & Download →</a>
    </div>
  </div>

  <div class="section">
    <h2>Portfolios</h2>

    <div class="empty card" *ngIf="portfolios.length === 0">
      <p>No portfolios yet.</p>
      <a routerLink="/portfolio-builder" class="btn-primary btn-narrow">Create one</a>
    </div>

    <div class="item card" *ngFor="let portfolio of portfolios">
      <span>{{ portfolio.heroTitle || 'Untitled Portfolio' }}</span>
      <a routerLink="/portfolio-builder">Open →</a>
    </div>
  </div>

</div>
